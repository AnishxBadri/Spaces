# Git hooks (lefthook). Installed via the root package.json "prepare" script.
# Pre-commit stays fast: format + lint only what's staged.
# The full gates (tsc, vitest) run in CI and before push.
#
# Everything here runs from the repo root, where prettier, eslint and their
# configs live; {staged_files} are root-relative paths, so apps/web files are
# covered without a per-package hook.

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,css,md,json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # Both halves: the root tsconfig (scripts/ + the root config files) and
    # apps/web's own. A bare `tsc --noEmit` at the root would typecheck the
    # scripts and silently skip the app.
    - name: typecheck
      run: pnpm run typecheck
