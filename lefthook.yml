# Git hooks (lefthook). Installed via the root package.json "prepare" script.
# Pre-commit stays fast: format + lint only what's staged.
# The full gates (tsc, vitest) run in CI and before push.
#
# Everything here runs from the repo root, where prettier and eslint run and
# their config shims live (the shims re-export packages/config's settings);
# {staged_files} are root-relative paths, so every package's files are covered
# without a per-package hook.

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,astro,css,md,json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,js,jsx,astro}'
      # Type-aware eslint over a cross-package staged set outruns node's 2 GB
      # default heap and the hook dies with SIGABRT; 4 GB holds it.
      run: NODE_OPTIONS=--max-old-space-size=4096 pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # `turbo run typecheck typecheck:root` — one tsc per package (@spaces/web,
    # @spaces/worker, @spaces/db, @spaces/core, @spaces/config) plus the root
    # tsconfig (scripts/ + the two config shims). A bare `tsc --noEmit` at the
    # root would typecheck the shims and silently skip every package.
    # tsc across every package outruns node's default heap on a laptop and dies
    # with exit 137; 8 GB holds it.
    - name: typecheck
      run: NODE_OPTIONS=--max-old-space-size=8192 pnpm run typecheck
