# Spaces on Render — a Blueprint (SPA-190, ship-12).
#
# One web service from the published image, one Render Postgres, one disk.
# Apply it from the dashboard: New → Blueprint → this repository, or paste
# the file. Everything an operator needs to know is deploy/README.md.
#
#   image     ghcr.io/anishxbadri/spaces:0.1.0 — pinned, never `latest`
#   database  Render Postgres 17. Its extension catalogue carries pgvector;
#             the migrations need pgvector >= 0.8 (the pg17 image compose
#             uses ships 0.8.x). If `select extversion from pg_extension
#             where extname = 'vector'` says less, the first vector migration
#             fails and this platform is unsupported until Render updates it.
#   disk      /data, persistent across deploys: blobs and secret.key.
#             Lose `./data/secret.key` and every stored credential is unrecoverable.
#             (On Render, ./data is the disk mounted at /data.) A disk pins the
#             service to one instance, which is the shape Spaces expects.
#   APP_URL   asked for when the Blueprint is applied (`sync: false`): Render's
#             Blueprint spec has no reference to a service's own public URL —
#             `fromService.property: host` is the *private-network* hostname —
#             so paste the https://….onrender.com URL Render assigns (or your
#             custom domain), scheme included. Render always terminates TLS, so
#             an http:// value here reproduces the Secure-cookie login loop.
#   Ollama    not provisioned; local embeddings are opt-in and need a host of
#             their own (Settings → AI · Providers).
#   token     the first-run setup token is printed to the service's Logs tab:
#             `[setup] First-run setup token: …`; open /setup and paste it.
services:
  - type: web
    name: spaces
    runtime: image
    image:
      url: ghcr.io/anishxbadri/spaces:0.1.0
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: spaces-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spaces-db
          property: connectionString
      - key: APP_URL
        sync: false

databases:
  - name: spaces-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: '17'
    databaseName: spaces
    user: spaces
    # Reachable from the web service over Render's private network only.
    ipAllowList: []
