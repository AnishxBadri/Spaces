# Tag. Every push to main tags whatever that push bumped: `core@X.Y.Z` for
# release.yml, `plugin-<id>@X.Y.Z` for plugin-release.yml, `sdk@X.Y.Z` as a
# record. A version moves by hand, in the commit that earns it
# (`pnpm release:bump`), so a push that bumps nothing tags nothing.
#
# RELEASE_TOKEN is a fine-grained token with contents write on this
# repository. It is required because a tag pushed with the workflow's own
# GITHUB_TOKEN starts no workflow: the tags would never build the image or
# the plugin. Without it this workflow warns and does nothing.
name: Tag

on:
  push:
    branches: [main]

concurrency:
  group: tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - id: token
        name: A token whose pushes start workflows
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set — no tag is pushed (GITHUB_TOKEN's pushes start no workflow)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Full history: `release:tag` reads each package.json at the commit
      # before this push.
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.ok == 'true'
      - name: Tag what this push bumped
        if: steps.token.outputs.ok == 'true'
        run: pnpm release:tag --since ${{ github.event.before }} --push
