name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow (SPA-187) calls this whole workflow for the tagged
  # commit and publishes nothing unless every job here — the gates and
  # `image-smoke` among them — is green for that exact commit.
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: spaces
          POSTGRES_PASSWORD: spaces
          POSTGRES_DB: spaces
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaces -d spaces"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spaces:spaces@localhost:5432/spaces
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One named step per gate, in CLAUDE.md's numbering, so a red run says
      # which gate broke from the job list alone. Each is the same command a
      # developer runs at the root; the turbo tasks behind them cover every
      # package (`turbo run lint --dry=json` lists web, db, core and the
      # `//#lint:root` half).
      - name: Gate 3 — prettier
        run: pnpm exec prettier --check .
      # `pnpm run lint`, not `eslint apps/web/src`: since SPA-142 there is a
      # second package with source in it, and the root half (scripts/) and
      # packages/config (the rules themselves) are in the same graph. It also carries gate 5 — the Instrument
      # vocabulary is the `instrument/vocabulary` eslint rule, not a grep.
      - name: Gates 4 and 5 — eslint (carries instrument/vocabulary)
        run: pnpm run lint
      - name: Gate 1 — typecheck
        run: pnpm run typecheck
      # The one thing that proves the journal applies to an *empty* database:
      # this service container is fresh, `spaces` has no tables, and boot.ts is
      # origin log → downgrade guard → migrate → seeds. Its own step, before
      # the suite, and the only writer of the `spaces` database in this job —
      # vitest derives `spaces_test*` from DATABASE_URL and builds its own.
      # No `.env.local` is written: every loader falls back to the environment,
      # which the job's `env:` above supplies.
      - name: Migrations apply to an empty database
        run: pnpm --filter @spaces/web exec tsx src/db/boot.ts
      - name: Gate 2 — vitest
        run: pnpm run test
      # SPA-196 (sdk-5): a plugin's job runs on the SDK's test Layers with no
      # database. The echo fixture's enrich job — resolve, receipt, fill — is
      # re-run here with DATABASE_URL unset and no .env.local, so a test Layer
      # that quietly reached Postgres would fail this step, not pass it.
      # Straight vitest, not turbo: the SDK is built by the step above.
      - name: The echo job runs with no database
        run: env -u DATABASE_URL pnpm --filter @spaces/plugin-echo exec vitest run src/enrich.test.ts
      - name: turbo run build
        run: pnpm run build

  # The browser suite (SPA-184): `pnpm e2e` — turbo builds @spaces/web, the
  # harness boots it twice against databases it creates on this service and
  # drops, and a headless Chromium drives the login gate, the first-run
  # window and closed signup. Additive: its own job, after nothing and in
  # front of nothing, and none of the gates above change for it. The trace of
  # a failed spec is uploaded; a green run uploads nothing.
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: spaces
          POSTGRES_PASSWORD: spaces
          POSTGRES_DB: spaces
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaces -d spaces"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spaces:spaces@localhost:5432/spaces
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only, with its system libraries. Test tooling on the runner,
      # never in the image: the Dockerfile's prune scopes cannot reach
      # @spaces/e2e.
      - name: Install Chromium
        run: pnpm --filter @spaces/e2e exec playwright install --with-deps chromium
      - name: pnpm e2e
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results/
          retention-days: 7

  # The runtime image, built once per run as its own named job (SPA-183), so
  # a broken build is red under its own name rather than as the first step of
  # whichever job happened to try it. Also the build guard (SPA-152): the
  # image stopped building the day lefthook arrived — `prepare` needs git,
  # alpine has none — and nothing in CI noticed. The checkout's .git is
  # excluded by .dockerignore, which is exactly the failing case. No push —
  # the image leaves this job as an artifact, and `hostability` and
  # `roundtrip` load those exact bytes instead of each building their own.
  # Deliberately not a dependency of `checks`: it must never sit in front of
  # the gates.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image (docker/Dockerfile, context = repo root)
        run: docker build -f docker/Dockerfile -t spaces:ci .
      # SPA-185: the image runs bundles with plain node. No application source
      # and no tsx may be in it — a regression here is a build that quietly
      # went back to running src/ through a loader.
      - name: No source and no tsx in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh spaces:ci -c 'ls /app; ls /app/apps/web/dist /app/apps/worker/dist /app/packages/db'
          SRC="$(docker run --rm --entrypoint sh spaces:ci -c 'find /app -type d -name src -not -path "*/node_modules/*"')"
          [ -z "$SRC" ] || { echo "source directories in the image: $SRC" >&2; exit 1; }
          N="$(docker run --rm --entrypoint sh spaces:ci -c 'ls node_modules/.bin | grep -c tsx || true')"
          [ "$N" = 0 ] || { echo "tsx is in the image ($N)" >&2; exit 1; }
      - name: Record its size
        run: |
          set -euo pipefail
          docker images spaces:ci
          BYTES="$(docker image inspect -f '{{.Size}}' spaces:ci)"
          {
            echo "### Runtime image"
            echo
            echo "| image | size |"
            echo "| --- | --- |"
            echo "| spaces:ci | $(( BYTES / 1024 / 1024 )) MiB ($BYTES bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the image to the jobs that boot it
        run: docker save spaces:ci | gzip -1 > spaces-ci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: spaces-ci-image
          path: spaces-ci.tar.gz
          retention-days: 1

  # Hostability contract #1 (CONTEXT.md): the entrypoint owns /data. A macOS
  # bind mount rewrites ownership on the way through, so a Linux runner is the
  # only place the trap is real. Deliberately a separate job: it boots an
  # image and must never sit in front of the gates above.
  hostability:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: spaces-ci-image
      - name: Load the runtime image built by `image`
        run: gunzip -c spaces-ci.tar.gz | docker load

      # SPA-193 (D54): the plugin index and the trusted signing keys are baked
      # into the image, at the paths @spaces/core/plugins/trust reads.
      - name: registry.json and plugin-keys/ are in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh spaces:ci -c \
            'test -f /app/registry.json && test -d /app/plugin-keys && ls -la /app/plugin-keys && head -c 200 /app/registry.json'

      - name: Mis-owned ./data — repairs, drops to 1000, takes an upload
        run: |
          set -euo pipefail
          mkdir -p data
          sudo chown 4242:4242 data
          MASTER_KEY="$(openssl rand -base64 32)"
          echo "MASTER_KEY=$MASTER_KEY" >> "$GITHUB_ENV"
          export MASTER_KEY
          cat > docker-compose.ci.yml <<'YAML'
          services:
            app:
              image: spaces:ci
              environment:
                MASTER_KEY: ${MASTER_KEY}
          YAML
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 300
          docker compose logs app
          # phase one ran as root and said so
          docker compose logs app | grep -F 'owned by 4242:4242 — repairing to 1000:1000'
          [ "$(stat -c '%u:%g' data)" = '1000:1000' ]
          # phase two is unprivileged. Note `docker exec` itself lands as root
          # now (the image has no USER — that is what lets phase one chown);
          # the claim under test is that the container's own processes dropped,
          # so read PID 1 and the process table rather than exec's identity.
          docker compose exec -T app sh -c 'grep ^Uid: /proc/1/status'
          docker compose exec -T app sh -c 'grep -qE "^Uid:[[:space:]]+1000[[:space:]]" /proc/1/status'
          docker compose exec -T app ps -o user,args | tee /dev/stderr \
            | grep -E '^node .*(server/index.mjs|worker/dist/index.mjs)'
          # upload through the HTTP API (the local driver's presigned PUT)
          head -c 4096 /dev/urandom > payload.bin
          KEY="$(sha256sum payload.bin | cut -d' ' -f1)"
          EXP="$(( ($(date +%s) + 300) * 1000 ))"
          SIG="$(node -e 'const {createHmac}=require("crypto");const [k,v,e]=process.argv.slice(1);process.stdout.write(createHmac("sha256",Buffer.from(process.env.MASTER_KEY,"base64")).update(`blob:${v}:${k}:${e}`).digest("base64url"))' "$KEY" put "$EXP")"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            --data-binary @payload.bin \
            "http://localhost:3000/api/blob/$KEY?exp=$EXP&sig=$SIG")"
          [ "$CODE" = 201 ]
          # the bytes landed under ./data on the host, owned by 1000
          BLOB="data/blobs/${KEY:0:2}/$KEY"
          sudo test -f "$BLOB"
          [ "$(sudo stat -c '%u' "$BLOB")" = 1000 ]
          echo "NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q app)")" >> "$GITHUB_ENV"

      - name: Correctly-owned tree gets no recursive chown
        run: |
          set -euo pipefail
          sudo mkdir -p okdata/blobs
          sudo sh -c 'for i in $(seq 0 99); do mkdir -p okdata/blobs/$i; for j in $(seq 0 99); do : > okdata/blobs/$i/$j; done; done'
          sudo chown -R 1000:1000 okdata
          # a mis-owned needle: a recursive chown would silently fix it
          sudo chown 4242:4242 okdata/blobs/0/0
          START=$(date +%s%3N)
          docker run -d --name nochown --network "$NET" \
            -e DATABASE_URL=postgresql://spaces:spaces@db:5432/spaces \
            -e MASTER_KEY="$MASTER_KEY" -e ROLE=web \
            -v "$PWD/okdata:/data" spaces:ci
          for _ in $(seq 1 60); do
            docker logs nochown 2>&1 | grep -q 'no repair needed' && break; sleep 1
          done
          echo "ownership phase finished $(( $(date +%s%3N) - START ))ms after run"
          docker logs nochown 2>&1 | grep -F 'ownership already 1000:1000 — no repair needed'
          # the needle is untouched: no recursive chown walked the tree
          [ "$(sudo stat -c '%u' okdata/blobs/0/0)" = 4242 ]
          docker rm -f nochown

      - name: Read-only /data refuses to boot, printing the fix
        run: |
          set -euo pipefail
          mkdir -p rodata
          set +e
          OUT="$(timeout 60 docker run --rm -v "$PWD/rodata:/data:ro" spaces:ci 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F 'chown -R 1000:1000 ./data' <<<"$OUT"

      - name: Already-unprivileged start (user 1000:1000)
        run: |
          set -euo pipefail
          # mis-owned: exits naming the fix, not an unreadable chown error
          sudo mkdir -p baddata && sudo chown 4242:4242 baddata
          set +e
          OUT="$(timeout 60 docker run --rm --user 1000:1000 -v "$PWD/baddata:/data" spaces:ci 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F 'chown -R 1000:1000 ./data' <<<"$OUT"
          # `set -e` does not fail on a negated command, so assert explicitly
          if grep -q 'chown:' <<<"$OUT"; then
            echo 'leaked a raw chown error instead of the instruction' >&2
            exit 1
          fi
          # correctly owned: boots
          sudo mkdir -p gooddata && sudo chown 1000:1000 gooddata
          docker run -d --name unpriv --user 1000:1000 --network "$NET" \
            -e DATABASE_URL=postgresql://spaces:spaces@db:5432/spaces \
            -e MASTER_KEY="$MASTER_KEY" -v "$PWD/gooddata:/data" spaces:ci
          for _ in $(seq 1 60); do
            docker logs unpriv 2>&1 | grep -q 'Listening' && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Running}}' unpriv)" = true ]
          docker exec unpriv sh -c 'grep -qE "^Uid:[[:space:]]+1000[[:space:]]" /proc/1/status'
          docker rm -f unpriv

      # Hostability contract 4: a ROLE starts its own process and nothing
      # else. Both containers share a database of their own, created empty
      # here, so no heartbeat the compose `app`'s worker ever wrote can answer
      # for them: ROLE=web alone must report the worker `absent` (no
      # worker_heartbeat row at all), and ROLE=worker — which serves no HTTP —
      # is proven through the heartbeat, by the image's own HEALTHCHECK
      # command and then by the web container's /api/health flipping to ok.
      - name: ROLE=web and ROLE=worker each start only their process
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T db createdb -U spaces roles
          ROLE_DB=postgresql://spaces:spaces@db:5432/roles
          sudo mkdir -p roledata && sudo chown 1000:1000 roledata
          docker run -d --name roleweb --network "$NET" -p 3001:3000 \
            -e DATABASE_URL="$ROLE_DB" -e MASTER_KEY="$MASTER_KEY" -e ROLE=web \
            -v "$PWD/roledata:/data" spaces:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/api/health >/dev/null 2>&1 && break; sleep 2
          done
          H="$(curl -fsS http://localhost:3001/api/health)"
          echo "$H"
          jq -e '.worker.status == "absent"' <<<"$H"
          docker exec roleweb ps -o args | tee roleweb.ps
          grep -q 'server/index.mjs' roleweb.ps
          if grep -q 'worker/dist/index.mjs' roleweb.ps; then
            echo 'ROLE=web started a worker' >&2; exit 1
          fi

          docker run -d --name roleworker --network "$NET" \
            -e DATABASE_URL="$ROLE_DB" -e MASTER_KEY="$MASTER_KEY" -e ROLE=worker \
            -v "$PWD/roledata:/data" spaces:ci
          HEALTH='node apps/worker/dist/health.mjs'
          for _ in $(seq 1 60); do
            docker exec roleworker sh -c "$HEALTH" >/dev/null 2>&1 && break; sleep 2
          done
          docker exec roleworker sh -c "$HEALTH"
          docker exec roleworker ps -o args | tee roleworker.ps
          grep -q 'worker/dist/index.mjs' roleworker.ps
          if grep -q 'server/index.mjs' roleworker.ps; then
            echo 'ROLE=worker started a web server' >&2; exit 1
          fi
          H="$(curl -fsS http://localhost:3001/api/health)"
          echo "$H"
          jq -e '.worker.status == "ok"' <<<"$H"
          docker rm -f roleweb roleworker

      # SPA-194 (sdk-11): boot reconciliation inside the image, not only
      # under tsx. The four loader fixtures are built on the runner, placed
      # in a fresh data dir as the installer will place them (lock.json pins
      # `tampered`, whose bundle is then edited), and a ROLE=all container
      # boots against a database of its own. Its worker must print one
      # verdict per plugin, `/api/health` must list the three degraded ones
      # and stay ok, and the `core.mailbox` row must come through untouched.
      # `echo` enabled is the proof that a bundle under /data resolves its
      # bare effect / zod / @spaces/sdk imports to the image's own copies.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the four loader fixtures
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@spaces/plugin-echo \
            --filter=@spaces/plugin-old-sdk --filter=@spaces/plugin-needs-key \
            --filter=@spaces/plugin-tampered
      - name: The loader's four-fixture boot, inside the image
        run: |
          set -euo pipefail
          C="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          $C exec -T db createdb -U spaces plugins
          q() { $C exec -T db psql -U spaces -d plugins -v ON_ERROR_STOP=1 -At -c "$1"; }
          for id in echo old-sdk needs-key tampered; do
            mkdir -p "plugdata/plugins/$id/current"
            cp "plugins/_fixtures/$id/dist/bundle.mjs" "plugins/_fixtures/$id/dist/manifest.json" \
              "plugdata/plugins/$id/current/"
          done
          SHA="$(sha256sum plugdata/plugins/tampered/current/bundle.mjs | cut -d' ' -f1)"
          printf '{"plugins":{"tampered":{"version":"0.1.0","sha256":"%s"}}}\n' "$SHA" \
            > plugdata/plugins/lock.json
          echo '// edited after the lock was written' >> plugdata/plugins/tampered/current/bundle.mjs
          sudo chown -R 1000:1000 plugdata
          health() { curl -fsS http://localhost:3002/api/health 2>/dev/null || true; }
          wait_worker() {
            for _ in $(seq 1 90); do
              jq -e '.worker.status == "ok"' <<<"$(health)" >/dev/null 2>&1 && return 0
              sleep 2
            done
            docker logs plugboot; return 1
          }
          docker run -d --name plugboot --network "$NET" -p 3002:3000 \
            -e DATABASE_URL=postgresql://spaces:spaces@db:5432/plugins \
            -e MASTER_KEY="$MASTER_KEY" -v "$PWD/plugdata:/data" spaces:ci
          # First boot migrates the empty database; the rows go in after.
          wait_worker
          q "insert into integration (capability_id, version, enabled) values
               ('echo', '0.1.0', true), ('old-sdk', '0.1.0', true),
               ('needs-key', '0.1.0', true), ('tampered', '0.1.0', true)"
          q "insert into integration (capability_id, version, enabled, status)
               values ('core.mailbox', '1', true, 'enabled')"
          MAILBOX="select row_to_json(i)::text || ' ' || xmin::text from integration i where capability_id = 'core.mailbox'"
          BEFORE="$(q "$MAILBOX")"
          docker restart plugboot
          # Not wait_worker: the heartbeat from before the restart is still
          # fresh. The verdicts are the signal — printed before any queue.
          for _ in $(seq 1 90); do
            [ "$(docker logs plugboot 2>&1 | grep -cF '[plugins]')" -ge 4 ] && break
            sleep 2
          done
          docker logs plugboot 2>&1 | grep -F '[plugins]' | tee verdicts.txt
          wait_worker
          grep -xF '[plugins] echo 0.1.0: enabled (unpinned: no lock.json entry)' verdicts.txt
          grep -xF '[plugins] needs-key: degraded — missing credential' verdicts.txt
          grep -xF '[plugins] old-sdk: degraded — requires sdk ^2.0, host provides 1.0.0' verdicts.txt
          grep -xF '[plugins] tampered: degraded — bundle sha does not match lock.json' verdicts.txt
          [ "$(wc -l < verdicts.txt)" -eq 4 ]
          H="$(health)"
          echo "$H"
          jq -e '.status == "ok" and ([.degradedPlugins[].id] == ["needs-key", "old-sdk", "tampered"])' <<<"$H"
          q "select capability_id, status, manifest->>'id' from integration order by 1"
          [ "$(q "select status || ' ' || (manifest->>'id') from integration where capability_id = 'echo'")" = 'enabled echo' ]
          [ "$(q "$MAILBOX")" = "$BEFORE" ]
          [ "$(docker inspect -f '{{.State.Running}}' plugboot)" = true ]
          docker rm -f plugboot

      - name: Supervision contract survives the privilege drop
        run: |
          set -euo pipefail
          sudo mkdir -p supdata && sudo chown 1000:1000 supdata
          run_sup() {
            docker rm -f sup >/dev/null 2>&1 || true
            docker run -d --name sup --network "$NET" \
              -e DATABASE_URL=postgresql://spaces:spaces@db:5432/spaces \
              -e MASTER_KEY="$MASTER_KEY" -v "$PWD/supdata:/data" spaces:ci
            for _ in $(seq 1 60); do
              docker exec sup pgrep -f '[w]orker/dist/index.mjs' >/dev/null 2>&1 && return 0
              sleep 2
            done
            docker logs sup; return 1
          }
          # worker death stops the container, non-zero
          run_sup
          docker exec sup sh -c 'kill "$(pgrep -f "[w]orker/dist/index.mjs" | head -1)"'
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' sup)" = false ] && break; sleep 1
          done
          docker logs sup 2>&1 | grep -F '[entrypoint] worker exited'
          [ "$(docker inspect -f '{{.State.ExitCode}}' sup)" -ne 0 ]
          # docker stop is still a clean, deliberate stop. `-t 30`: a full
          # shutdown (Nitro's 5s graceful close, then pg-boss) takes about ten
          # seconds, right on the daemon's default grace, so a bare `docker
          # stop` races it into SIGKILL — same before this slice as after.
          run_sup
          docker stop -t 30 sup
          docker logs sup 2>&1 | grep -F '[entrypoint] stopping on signal'
          [ "$(docker inspect -f '{{.State.ExitCode}}' sup)" -eq 0 ]
          docker rm -f sup

      # Hostability contract 4 in the two-container shape (SPA-185): the
      # ROLE=worker container's HEALTHCHECK is the bundled health entry, and it
      # is what notices a worker that stopped working. The process is frozen
      # (SIGSTOP from the host, so the container keeps running and nothing
      # restarts it) rather than killed — a dead PID 1 ends the container,
      # which proves supervision, not health. Its heartbeat ages past 60s, the
      # check fails three times, and Docker calls it unhealthy; the web
      # container, whose check is HTTP, stays healthy throughout.
      - name: Split roles — a stopped worker goes unhealthy, web stays healthy
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          sudo mkdir -p data && sudo chown 1000:1000 data
          cat > docker-compose.split-ci.yml <<'YAML'
          services:
            app:
              image: spaces:ci
              pull_policy: never
              environment:
                MASTER_KEY: ${MASTER_KEY}
            worker:
              image: spaces:ci
              pull_policy: never
              environment:
                MASTER_KEY: ${MASTER_KEY}
          YAML
          SPLIT=(-f docker-compose.yml -f docker-compose.split.yml -f docker-compose.split-ci.yml)
          docker compose "${SPLIT[@]}" up -d --no-build --wait --wait-timeout 300
          docker compose "${SPLIT[@]}" ps
          W="$(docker compose "${SPLIT[@]}" ps -q worker)"
          A="$(docker compose "${SPLIT[@]}" ps -q app)"
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$W")" = healthy ]
          docker inspect -f '{{json .Config.Healthcheck.Test}}' "$W" | tee /dev/stderr | grep -F 'apps/worker/dist/health.mjs'
          sudo kill -STOP "$(docker inspect -f '{{.State.Pid}}' "$W")"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$W")" = unhealthy ] && break; sleep 5
          done
          docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}' "$W"
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$W")" = unhealthy ]
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$A")" = healthy ]
          sudo kill -CONT "$(docker inspect -f '{{.State.Pid}}' "$W")"
          docker compose "${SPLIT[@]}" down -v

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          docker compose -f docker-compose.yml -f docker-compose.split.yml -f docker-compose.split-ci.yml down -v 2>/dev/null || true
          docker rm -f sup unpriv nochown roleweb roleworker 2>/dev/null || true

  # Upload → preview in a real browser against the image built for this
  # commit (SPA-186): one job that is both the browser smoke and the image
  # smoke. The name is a contract — the release workflow (ship-8) requires
  # `image-smoke` before it pushes an image anywhere; rename it only with
  # every reference. Same image bytes as `hostability` (the `image` job's
  # artifact) and the same compose-override shape, not a third recipe. The
  # app must report db ok AND worker ok before the first spec, so a worker
  # that never comes up fails here, with the payload and the logs, and is
  # never mistaken for a broken upload. The steps are the composite action
  # .github/actions/image-smoke (SPA-187 moved them there to share them).
  image-smoke:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spaces-ci-image
      - name: Load the runtime image built by `image`
        run: gunzip -c spaces-ci.tar.gz | docker load
      # The recipe lives in one place because the release workflow runs it
      # too, against the amd64 variant of the image it is about to push.
      - uses: ./.github/actions/image-smoke
        with:
          image: spaces:ci

  # Hostability contract #5 (CONTEXT.md): backup is both-or-neither, and
  # rollback is restore. Prose cannot prove that, so this job destroys the box
  # and puts it back: up → plant a document, its blob and a credential →
  # backup.sh → `docker compose down -v` + `rm -rf ./data` → restore.sh → the
  # app boots, the document is listed, its bytes still hash to the same key,
  # and the credential decrypts. `down -v` and `rm -rf ./data` are safe here
  # and nowhere else: a fresh runner owns this whole Docker daemon.
  #
  # Separate job, like `hostability`, so it never sits in front of the gates.
  # No MASTER_KEY anywhere: the point is the auto-generated ./data/secret.key,
  # the half of the backup that everything else is worthless without.
  roundtrip:
    runs-on: ubuntu-latest
    needs: image
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: spaces-ci-image
      - name: Load the runtime image built by `image`
        run: gunzip -c spaces-ci.tar.gz | docker load

      # The fixture runs inside the app container, which has no tsx and no
      # source since SPA-185 — so it is bundled here the way the boot entry
      # is (apps/web/vite.boot.config.ts, `--ssr` naming another entry): the
      # workspace code inlined, every npm import left to the image's own
      # node_modules. Built on the runner, copied in, run with plain node.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle the roundtrip fixture
        run: |
          # @spaces/sdk first: its exports are dist/, and core imports it at
          # runtime since SPA-195 (the identity normalizers).
          pnpm --filter @spaces/sdk build
          pnpm --filter @spaces/web exec vite build --config vite.boot.config.ts \
            --ssr scripts/roundtrip-fixture.ts --outDir ../../fixture --emptyOutDir
          ls -la fixture

      - name: Boot, then plant a document, its blob and a credential
        run: |
          set -euo pipefail
          mkdir -p data
          cat > docker-compose.ci.yml <<'YML'
          services:
            app:
              image: spaces:ci
          YML
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://localhost:3000/api/health

          # The key the app generated for itself on first boot. Reading it
          # needs root because the entrypoint left it 0600 owned by 1000 —
          # which is exactly what the restore has to reproduce.
          sudo test -f data/secret.key
          MASTER_KEY="$(sudo cat data/secret.key | tr -d '\n')"
          echo "::add-mask::$MASTER_KEY"
          echo "MASTER_KEY_BEFORE=$MASTER_KEY" >> "$GITHUB_ENV"
          export MASTER_KEY

          head -c 65536 /dev/urandom > payload.bin
          KEY="$(sha256sum payload.bin | cut -d' ' -f1)"
          SECRET="sk-roundtrip-$(openssl rand -hex 8)"
          echo "::add-mask::$SECRET"
          {
            echo "KEY=$KEY"
            echo "SECRET=$SECRET"
          } >> "$GITHUB_ENV"

          # Upload through the app's own presigned PUT, so the blob lands in
          # ./data the way a real deck does — hashed by the store, not by us.
          EXP="$(( ($(date +%s) + 600) * 1000 ))"
          SIG="$(node -e 'const {createHmac}=require("crypto");const [k,v,e]=process.argv.slice(1);process.stdout.write(createHmac("sha256",Buffer.from(process.env.MASTER_KEY,"base64")).update(`blob:${v}:${k}:${e}`).digest("base64url"))' "$KEY" put "$EXP")"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            --data-binary @payload.bin \
            "http://localhost:3000/api/blob/$KEY?exp=$EXP&sig=$SIG")"
          [ "$CODE" = 201 ]

          docker compose cp fixture/roundtrip-fixture.mjs app:/app/roundtrip-fixture.mjs
          docker compose exec -T app node /app/roundtrip-fixture.mjs \
            plant --blob="$KEY" --size="$(stat -c%s payload.bin)" --secret="$SECRET"
          echo "NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q db)")" >> "$GITHUB_ENV"

      - name: backup.sh — and what it cost
        run: |
          set -euo pipefail
          # As root: the blob tree is 0600 owned by 1000, so an operator who
          # is not root cannot read their own blobs to tar them. The env goes
          # in through the root shell rather than `sudo -E`, which sudoers is
          # free to refuse.
          START=$(date +%s%3N)
          sudo sh -c 'COMPOSE_FILE="$0" ./scripts/backup.sh ./backups' "$COMPOSE_FILE"
          MS=$(( $(date +%s%3N) - START ))
          DIR="$(ls -d backups/*/ | tail -1)"
          DIR="${DIR%/}"
          echo "BACKUP_DIR=$DIR" >> "$GITHUB_ENV"
          DUMP=$(stat -c%s "$DIR/dump.sql")
          TAR=$(stat -c%s "$DIR/blobs.tgz")
          # ship-10's install doc quotes these numbers.
          {
            echo "### Backup round trip"
            echo
            echo "| measurement | value |"
            echo "| --- | --- |"
            echo "| dump.sql | $DUMP bytes |"
            echo "| blobs.tgz | $TAR bytes |"
            echo "| backup.sh wall clock | ${MS} ms |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[roundtrip] dump $DUMP bytes, blobs $TAR bytes, ${MS} ms"

      - name: Total loss — down -v and rm -rf ./data
        run: |
          set -euo pipefail
          docker compose down -v
          sudo rm -rf ./data
          [ ! -e data ]
          docker volume ls

      - name: restore.sh — as an ordinary user, not root
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          ./scripts/restore.sh "$BACKUP_DIR"
          MS=$(( $(date +%s%3N) - START ))
          echo "| restore.sh wall clock | ${MS} ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "[roundtrip] restore ${MS} ms"
          # 0600 owned by 1000, put there by the script and not by the
          # entrypoint — the app has not been started yet.
          [ "$(sudo stat -c '%a %u:%g' data/secret.key)" = '600 1000:1000' ]
          [ "$(sudo cat data/secret.key | tr -d '\n')" = "$MASTER_KEY_BEFORE" ]

      - name: The app comes up, the document is listed, the bytes match
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://localhost:3000/api/health
          docker compose cp fixture/roundtrip-fixture.mjs app:/app/roundtrip-fixture.mjs
          docker compose exec -T app node /app/roundtrip-fixture.mjs \
            verify --blob="$KEY" --secret="$SECRET"
          export MASTER_KEY="$MASTER_KEY_BEFORE"
          EXP="$(( ($(date +%s) + 600) * 1000 ))"
          SIG="$(node -e 'const {createHmac}=require("crypto");const [k,v,e]=process.argv.slice(1);process.stdout.write(createHmac("sha256",Buffer.from(process.env.MASTER_KEY,"base64")).update(`blob:${v}:${k}:${e}`).digest("base64url"))' "$KEY" get "$EXP")"
          curl -fsS -o got.bin "http://localhost:3000/api/blob/$KEY?exp=$EXP&sig=$SIG"
          [ "$(sha256sum got.bin | cut -d' ' -f1)" = "$KEY" ]
          cmp payload.bin got.bin

      - name: Both refusals, each naming what to do instead
        run: |
          set -euo pipefail
          set +e
          OUT="$(./scripts/restore.sh "$BACKUP_DIR" 2>&1)"; CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F 'docker compose stop app' <<<"$OUT"
          docker compose stop app
          set +e
          OUT="$(./scripts/restore.sh "$BACKUP_DIR" 2>&1)"; CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F -- '--force' <<<"$OUT"

      - name: A half that fails changes nothing
        run: |
          set -euo pipefail
          cp -r "$BACKUP_DIR" broken
          chmod -R u+w broken
          printf 'not a tar' > broken/blobs.tgz
          set +e
          OUT="$(./scripts/restore.sh broken --force 2>&1)"; CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F 'nothing was changed' <<<"$OUT"
          # the staging database the dump half had already loaded is gone
          LEFT="$(docker compose exec -T db psql -qtAX -U spaces -d postgres \
            -c "select count(*) from pg_database where datname like 'spaces\_restore\_%'")"
          [ "$LEFT" = 0 ]
          # and the workspace is still there, untouched
          docker compose up -d --wait --wait-timeout 300
          docker compose cp fixture/roundtrip-fixture.mjs app:/app/roundtrip-fixture.mjs
          docker compose exec -T app node /app/roundtrip-fixture.mjs \
            verify --blob="$KEY" --secret="$SECRET"

      - name: An older image refuses the restored database (ship-4's guard)
        run: |
          set -euo pipefail
          # "Older image" = one whose journal stops a migration short, mounted
          # over the image's journal so the guard reads it exactly as a real
          # older tag would — without a second image build. Since SPA-142 that
          # path is /app/packages/db/drizzle: the migrator resolves the folder
          # from its own import.meta.url, so the mount has to land where the
          # package actually is.
          cp -r packages/db/drizzle drizzle-old
          LAST="$(jq -r '.entries[-1].tag' packages/db/drizzle/meta/_journal.json)"
          jq '.entries |= .[:-1]' packages/db/drizzle/meta/_journal.json > drizzle-old/meta/_journal.json
          rm "drizzle-old/$LAST.sql"
          mkdir -p olddata
          set +e
          OUT="$(timeout 120 docker run --rm --network "$NET" \
            -e DATABASE_URL=postgresql://spaces:spaces@db:5432/spaces \
            -v "$PWD/drizzle-old:/app/packages/db/drizzle:ro" -v "$PWD/olddata:/data" \
            spaces:ci 2>&1)"; CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -ne 0 ]
          grep -F 'Restore the backup taken before the upgrade' <<<"$OUT"

      - name: Tear down
        if: always()
        run: docker compose down -v || true
