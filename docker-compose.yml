name: spaces
# Production self-host: `docker compose up` works first try.
# Three containers, two volumes. Full env surface documented in CONTEXT.md.
#
# Web and worker run apart so a worker that dies or runs out of memory never
# takes the web app down with it, and a worker that stops working shows as
# unhealthy. A host that can run only one container sets ROLE=all on a single
# app container instead (deploy/ has those templates).

# One environment for both halves: set a variable here once and the web app
# and the worker both see it.
x-env: &env
  DATABASE_URL: postgresql://${POSTGRES_USER:-spaces}:${POSTGRES_PASSWORD:-spaces}@db:5432/${POSTGRES_DB:-spaces}
  APP_URL: ${APP_URL:-http://localhost:3000}
  # Optional — auto-generated to /data/secret.key if absent.
  # MASTER_KEY:
  # SMTP_URL:
  # STORAGE_DRIVER: local
  # First-boot plugin install and key seed; see docs/install.md.
  # SPACES_PLUGINS: apollo,rss
  # SPACES_CREDENTIAL_APOLLO:

services:
  app:
    # The published image, pinned (SPA-187). Upgrading is changing this tag
    # on purpose, after a backup — there is no `latest` to drift onto. The
    # same digest is on Docker Hub as docker.io/<owner>/spaces:0.1.0, and
    # both carry a cosign signature; GHCR also carries SLSA provenance.
    # `worker` reuses this line, so both halves always run the same bytes.
    image: &image ghcr.io/anishxbadri/spaces:0.1.0
    # Developer override — build from a checkout instead of pulling. The
    # context is the repo root (the Dockerfile's prune stage cuts the whole
    # workspace), and the Dockerfile is named because it lives in docker/.
    # Uncomment both lines here and under `worker`, then
    # `docker compose up --build`:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      <<: *env
      ROLE: web
    volumes:
      # Blobs + auto-generated secret.key. BACK THIS UP together with pg_dump.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: *image
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    environment:
      <<: *env
      ROLE: worker
    volumes:
      # The same ./data as the web half: blobs and secret.key are one unit,
      # and the backup stays both-or-neither.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      # Both roles run migrations on boot. Waiting for the web half to be
      # healthy means one of them runs them and the other finds them applied,
      # instead of two migrators racing for the journal on a cold start.
      app:
        condition: service_healthy
    # No ports: the worker serves nothing. Its healthcheck reads its own
    # worker_heartbeat row, so `docker compose ps` shows it unhealthy within a
    # minute of the worker process stopping.
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaces}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaces}
      POSTGRES_DB: ${POSTGRES_DB:-spaces}
    volumes:
      - spaces_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spaces -d spaces']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional local model server — not started by `docker compose up`, which
  # stays at three containers. `docker compose --profile ollama up -d`, then
  # `docker compose exec ollama ollama pull nomic-embed-text`, then save
  # Ollama at http://ollama:11434 under Settings → AI · Providers.
  ollama:
    image: ollama/ollama
    profiles: ['ollama']
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  spaces_pgdata:
  ollama_models:
