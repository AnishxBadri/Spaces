name: dealos-dev
# Dev-only: runs Postgres locally while the app runs via `pnpm dev`.
# Production compose (app + db) is docker-compose.yml.
#
# MinIO exists here ONLY to develop/test the S3 driver — it is never part of
# the production compose (CONTEXT.md: nothing bundled, local FS default).
# Exercise it with:
#   STORAGE_DRIVER=s3 S3_BUCKET=dealos-dev S3_ENDPOINT=http://localhost:9000 \
#   S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin pnpm dev
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dealos
      POSTGRES_PASSWORD: dealos
      POSTGRES_DB: dealos
    ports:
      - '5432:5432'
    volumes:
      - dealos_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealos -d dealos']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - dealos_dev_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the dev bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dealos-dev
      "

volumes:
  dealos_dev_pgdata:
  dealos_dev_minio:
